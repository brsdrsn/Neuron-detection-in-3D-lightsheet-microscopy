[metadata]
name = napari-large-tiler
version = 0.1.0
description = A tiling plugin for large Zarr images in napari
author = Your Name
license = MIT

[options]
package_dir =
    = src
packages = find:
install_requires =
    napari
    magicgui
    numpy
    dask
    zarr

[options.packages.find]
where = src

[options.package_data]
napari_large_tiler = napari.yaml

[options.entry_points]
napari.manifest =
    napari-large-tiler = napari_large_tiler:napari.yaml
